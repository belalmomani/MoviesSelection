name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build the release APK (debug-signed, minified)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Build release APK (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoviesSelection-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            app/build/test-results
          if-no-files-found: ignore

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            app/build/reports
            **/build/outputs/logs
          if-no-files-found: ignore
