# Edit these two values later when you want to change them (one place only).
# Priority for the TMDB key: Gradle property / TMDB_API_KEY env (GitHub secret) > this file > in-app Settings override.
# Keep this value EMPTY in the repository: set the key as the GitHub Actions secret TMDB_API_KEY (CI builds read it from there).
TMDB_API_KEY=
# Ads: banner on Home and Details only. Set ADS_ENABLED=false to remove the SDK from the build completely.
ADS_ENABLED=true
START_IO_APP_ID=209723706

# Public URL of your privacy policy (e.g. your GitHub Pages link to docs/privacy.html). Shown in About when set.
PRIVACY_URL=

# GitHub repo (owner/name) that publishes builds as Releases, used by the in-app update check.
UPDATE_REPO=belalmomani/MoviesSelection
