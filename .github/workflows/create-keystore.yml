name: Create release keystore (run once)

on:
  workflow_dispatch:
    inputs:
      password:
        description: "Password for the keystore and key (6+ chars, remember it)"
        required: true
      alias:
        description: "Key alias"
        required: true
        default: "moviesselection"

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate keystore
        env:
          PW: ${{ inputs.password }}
          ALIAS: ${{ inputs.alias }}
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=Movies Selection, O=Movies Selection, C=JO"
          base64 -w 0 release.keystore > release.keystore.base64.txt
      - name: Upload (private artifact - download it, back it up, then DELETE the artifact)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.keystore
            release.keystore.base64.txt
          retention-days: 1
